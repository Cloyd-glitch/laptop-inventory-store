  <path d="M8 15 L20 15 L20 16 L8 16 Z" fill="url(#copper)" opacity="0.7"/>
  <path d="M8 18 L18 18 L18 19 L8 19 Z" fill="url(#copper)" opacity="0.4"/>
  
  <!-- Base Top -->
  <path d="M2 24 L30 24 L28 26 L4 26 Z" fill="url(#case)"/>
  
  <!-- Trackpad indent -->
  <rect x="13" y="24.2" width="6" height="1.2" fill="#111"/>
  
  <!-- Base Bottom lip -->
