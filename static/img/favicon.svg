  </defs>
  
  <!-- Outer lid -->
  <rect x="3" y="6" width="26" height="18" rx="2" fill="url(#case)" stroke="#555" stroke-width="0.5"/>
  
  <!-- Screen -->
  <rect x="5" y="8" width="22" height="14" fill="url(#screen)"/>
  
  <!-- Screen content (Copper accent) -->
