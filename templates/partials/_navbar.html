<nav class="navbar" role="navigation" aria-label="Main navigation">
  <div class="navbar-inner">

    <!-- Brand -->
    <a href="{% url 'catalog:list' %}" class="navbar-brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>
      </svg>
      Laptop<span>Store</span>
    </a>

    <!-- Nav links -->
    <ul class="navbar-nav" role="list">
      <li><a href="{% url 'catalog:list' %}" id="nav-catalog">Browse</a></li>
      {% if user.is_authenticated %}
        <li><a href="{% url 'accounts:my_orders' %}" id="nav-orders">My Orders</a></li>
        <li><a href="{% url 'accounts:my_bookings' %}" id="nav-bookings">Bookings</a></li>
      {% endif %}
    </ul>

    <!-- Right actions -->
    <div class="navbar-actions">
      <!-- Cart -->
      <a href="{% url 'orders:cart' %}" class="cart-btn" id="nav-cart" aria-label="Shopping cart">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        Cart
        {% if cart_item_count > 0 %}
          <span class="cart-badge" aria-label="{{ cart_item_count }} items in cart">{{ cart_item_count }}</span>
        {% endif %}
      </a>

      <!-- Auth -->
      {% if user.is_authenticated %}
        <a href="{% url 'accounts:profile' %}" class="btn btn-secondary btn-sm" id="nav-profile">
          {{ user.username }}
        </a>
        <form method="post" action="{% url 'accounts:logout' %}" style="display:inline;">
          {% csrf_token %}
          <button type="submit" class="btn btn-secondary btn-sm" id="nav-logout">Sign out</button>
        </form>
      {% else %}
        <a href="{% url 'accounts:login' %}" class="btn btn-secondary btn-sm" id="nav-login">Sign in</a>
        <a href="{% url 'accounts:signup' %}" class="btn btn-primary btn-sm" id="nav-signup">Register</a>
      {% endif %}
    </div>

  </div>
</nav>
