{% extends "staff_panel/base.html" %}

{% block page_title %}Confirm Deletion{% endblock %}

{% block content %}
<div class="sp-form-card" style="margin: 0 auto; max-width: 600px; text-align:center;">
  <div style="font-size:48px;margin-bottom:16px;">⚠️</div>
  <h2>Are you sure?</h2>
  <p style="color:var(--text-muted); font-size:18px; margin:24px 0 40px;">
    You are about to permanently delete:<br>
    <strong style="color:var(--text-primary);">{{ object_name }}</strong>
  </p>
  
  <form method="post" style="display:flex; gap:16px; justify-content:center;">
    {% csrf_token %}
    <button type="submit" class="sp-btn sp-btn-primary" style="background:var(--danger); box-shadow:none; color:white !important;">Yes, Delete</button>
    <a href="{% url cancel_url %}" class="sp-btn sp-btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
